services:
  # 1. Zippin Backend API (Independent Web Service)
  - type: web
    name: zippin-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/products?limit=1
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@zippin.in
      - key: ADMIN_PASSWORD
        value: ZippinAdmin@2026
      - key: MONGO_URI
        value: mongodb+srv://mk2251842_db_user:30y3SYcdhns1eige@cluster0.bdczfs1.mongodb.net/zippin?retryWrites=true&w=majority
      - key: CLOUDINARY_CLOUD_NAME
        value: dbfchlmcw
      - key: CLOUDINARY_API_KEY
        value: 827889721687563
      - key: CLOUDINARY_API_SECRET
        value: b3NQNKSNNGLpcnLXqDKEI8q3d3Q
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # 2. Zippin Customer Storefront (Independent Next.js Web Service)
  - type: web
    name: zippin-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: zippin-backend
          property: host
      # Firebase Web Configuration for Customer Login & Notifications
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false

  # 3. Zippin Operations Admin Console (Independent Next.js Web Service)
  - type: web
    name: zippin-admin
    env: node
    plan: free
    rootDir: admin
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: zippin-backend
          property: host

  # 4. Zippin Rider / Delivery Partner App (Independent Static Site / Mobile Web App)
  - type: static
    name: zippin-rider
    rootDir: rider
    buildCommand: echo "Rider app ready"
    publishPath: .
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
